name: Generate publication previews

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0' # weekly, Sunday 6am UTC

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Generate previews
        run: node scripts/generate-previews.js

      - name: Commit new previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/previews/ _data/previews.yml
          git diff --staged --quiet || git commit -m "Update publication preview images"
          git push
